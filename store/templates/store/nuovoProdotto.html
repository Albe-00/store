{% extends 'store/base.html' %}

{% block title%} 
Nuovo Prodotto
{% endblock %}


{% block content %}
<h3>Aggiungi un nuovo prodotto</h3>
<form method="post" action="/nuovoProdotto/" class="form-group">
    {% csrf_token %}
    <div class="input-group mb-3">
        {{form}}
        <div class="input-group">
            <button type="submit" name="save" class="btn btn-success">Aggiungi</button>
        </div>
    </div>
</form>
{% endblock %}
