{% extends 'store/base.html' %}

{% block styleCSS %}
    <style>
        .bottoneModificatore{
            border: none;
        }

        .form-orizzontale{
            display: flex;
            flex-direction: row;
        }
    </style>
{% endblock %}

{% block title%}
Revisione di Acquisto Rapido
{% endblock %}

{% block content %}
    <h1>Revisione di Acquisto Rapido</h1>



    <form method="post" action="revisioneAcquistoRapido" class="form-group form-orizzontale">
        {% csrf_token %}
        <input type="hidden" name="idProdotto" value="{{prodottoDaRevisionare.id}}">
        <input type="hidden" name="quantita" value="{{quantita}}">
        <span class="input-group-text" >{{ quantita}}x</span>
        <span class="input-group-text" >{{ prodottoDaRevisionare }}</span>
        <button class="bottoneModificatore" type="submit" name="diminuisciQuantitaOggetto"><span class="input-group-text">-</span></button>
        <button class="bottoneModificatore" type="submit" name="aumentaQuantitaOggetto"><span class="input-group-text">+</span></button>
        <button class="bottoneModificatore" type="submit" name="rimuoviOggetto"><span class="input-group-text">X</span></button>

    </form>



    <h3>Totale: {{ totale }} €</h3>

    <form method="post" action="effettuaAcquistoRapido" class="form-group">
        {% csrf_token %}
        <input type="hidden" name="idProdotto" value="{{prodottoDaRevisionare.id}}">
        <input type="hidden" name="quantita" value="{{quantita}}">
        <button type="submit" name="annulla" class="btn btn-primary">Annulla</button>
        <button type="submit" name="effettuaAcquisto" class="btn btn-primary">Conferma e vai al pagamento</button>
    </form>

{% endblock %}
